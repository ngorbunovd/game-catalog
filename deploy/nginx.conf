server {
    listen 80;
    server_name antology.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name antology.local;

    ssl_certificate     /etc/letsencrypt/live/antology.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antology.local/privkey.pem;

    client_max_body_size 15m;

    # Админка: Basic Auth
    auth_basic           "Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /admin/          { proxy_pass http://127.0.0.1:3000; }
    location /api/pending/    { proxy_pass http://127.0.0.1:3000; }

    # Публичные запросы
    auth_basic off;
    location /                { proxy_pass http://127.0.0.1:3000; }

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

